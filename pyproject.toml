[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptosafe"
version = "0.1.0"
description = "Desktop Python application for cryptography demonstration and multi-factor authentication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

